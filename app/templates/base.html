<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Staff Count{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>

<a href="#main-content" class="skip-link">Skip to main content</a>

<header class="app-header" role="banner">
  <a href="/campaigns" class="app-header__brand" aria-label="Staff Count home">
    <!--
      LOGO PLACEHOLDER
      Replace this <div> with:
        <img src="{{ url_for('static', filename='logo.svg') }}"
             alt="ICRC" width="34" height="34">
      using an officially licensed asset from ICRC Brand & Identity.

      LEGAL NOTICE: The Red Cross and Red Crescent emblems are protected
      under the Geneva Conventions (1949). They may NOT be used decoratively.
      Contact ICRC Brand & Identity before placing any emblem here.
    -->
    <div class="logo-placeholder" aria-hidden="true">LOGO</div>
    <div class="app-header__wordmark">
      <span class="app-header__name">Staff Count</span>
      <span class="app-header__context">Field Communication Gateway</span>
    </div>
  </a>
</header>

<div class="app-shell">

  <nav class="app-sidebar" aria-label="Primary navigation">

    <a href="/campaigns"
       class="sidebar-link{% if request.path == '/' or request.path.startswith('/campaigns') %} sidebar-link--active{% endif %}"
       {% if request.path == '/' or request.path.startswith('/campaigns') %}aria-current="page"{% endif %}>
      <svg class="sidebar-link__icon" aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M14 2L2 7l4 3 5-4-4 5 3 4z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
      Campaigns
    </a>

    <a href="/contacts"
       class="sidebar-link{% if request.path.startswith('/contacts') %} sidebar-link--active{% endif %}"
       {% if request.path.startswith('/contacts') %}aria-current="page"{% endif %}>
      <svg class="sidebar-link__icon" aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none">
        <circle cx="8" cy="5" r="3" stroke="currentColor" stroke-width="1.5"/>
        <path d="M2 13c0-3.314 2.686-5 6-5s6 1.686 6 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      Contacts
    </a>

    <a href="/groups"
       class="sidebar-sublink{% if request.path.startswith('/groups') %} sidebar-sublink--active{% endif %}"
       {% if request.path.startswith('/groups') %}aria-current="page"{% endif %}>
      Groups
    </a>

    <a href="/reports"
       class="sidebar-link{% if request.path.startswith('/reports') %} sidebar-link--active{% endif %}"
       {% if request.path.startswith('/reports') %}aria-current="page"{% endif %}>
      <svg class="sidebar-link__icon" aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none">
        <rect x="2" y="9" width="3" height="5" rx="1" fill="currentColor" opacity=".5"/>
        <rect x="6.5" y="5" width="3" height="9" rx="1" fill="currentColor" opacity=".7"/>
        <rect x="11" y="2" width="3" height="12" rx="1" fill="currentColor"/>
      </svg>
      Reports
    </a>

  </nav>

  <main class="app-main" id="main-content">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash-banner flash-banner--{{ category }}" role="alert">
          <span>{{ message }}</span>
          <button type="button" class="flash-banner__dismiss" aria-label="Dismiss" onclick="this.parentElement.remove()">×</button>
        </div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

</div>

</body>
</html>
